# GitHub Actions workflow for Maven-based Java CI: it runs tests on pushes/PRs to main.
name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Checks out the repository so the runner can access project files.
      - uses: actions/checkout@v5
      # Installs Temurin JDK and enables Maven dependency caching for faster CI runs.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Executes the Maven test phase using the project's pom.xml.
      - run: mvn -B test --file pom.xml